name: Build iOS Rust Toolchain Deb

on:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
    - name: Install Dependencies
      run: |
        brew install dpkg

    - name: Download Rust Toolchain (Core Only)
      run: |
        curl -LO https://static.rust-lang.org/dist/rust-1.79.0-aarch64-apple-darwin.tar.gz
        tar -xzf rust-1.79.0-aarch64-apple-darwin.tar.gz

        curl -LO https://static.rust-lang.org/dist/rust-std-1.79.0-aarch64-apple-ios.tar.gz
        tar -xzf rust-std-1.79.0-aarch64-apple-ios.tar.gz

        # 极限瘦身
        rm -rf rust-1.79.0-aarch64-apple-darwin/rustc/bin/clippy*
        rm -rf rust-1.79.0-aarch64-apple-darwin/rustc/bin/rustdoc*
        rm -rf rust-1.79.0-aarch64-apple-darwin/rustc/bin/rustfmt*
        rm -rf rust-1.79.0-aarch64-apple-darwin/rustc/bin/cargo-clippy*
        rm -rf rust-1.79.0-aarch64-apple-darwin/rustc/bin/cargo-fmt*

    - name: Install ldid
      run: |
        curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
        chmod +x ldid_macosx_arm64
        sudo mv ldid_macosx_arm64 /usr/local/bin/ldid
        ldid -h || true

    - name: Create Deb Package
      run: |
        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/bin
        mkdir -p deb-pkg/usr/lib/rustlib
        mkdir -p deb-pkg/etc/profile.d
        mkdir -p deb-pkg/usr/share/rust-toolchain-ios

        curl -L -o deb-pkg/usr/share/rust-toolchain-ios/icon.png https://raw.githubusercontent.com/rust-lang/rust-artwork/master/logo/rust-logo-blk.png

        # ===== 核心修改：精简 Depends，去掉了 zlib1g 等高危包名 =====
        cat > deb-pkg/DEBIAN/control <<EOF
        Package: rust-toolchain-ios
        Name: Rust Toolchain for iOS
        Version: 1.79.0
        Architecture: iphoneos-arm64
        Maintainer: YourName
        Depends: llvm-16, libtapi-dev, libssl3, libcurl4, git, make
        Description: Rust compiler (rustc) and cargo for iOS jailbreak environment.
        Section: Development
        Icon: file:///usr/share/rust-toolchain-ios/icon.png
        EOF

        cat > deb-pkg/etc/profile.d/rust-ios.sh <<EOF
        export TMPDIR=/tmp
        export CC=clang
        export CXX=clang++
        export AR=llvm-ar
        export RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld"
        export PATH=/usr/bin:\$PATH
        EOF

        cp rust-1.79.0-aarch64-apple-darwin/rustc/bin/rustc deb-pkg/usr/bin/
        cp rust-1.79.0-aarch64-apple-darwin/cargo/bin/cargo deb-pkg/usr/bin/
        cp -r rust-1.79.0-aarch64-apple-darwin/rustc/lib/rustlib/* deb-pkg/usr/lib/rustlib/
        cp -r rust-std-1.79.0-aarch64-apple-ios/rust-std-aarch64-apple-ios/lib/rustlib/* deb-pkg/usr/lib/rustlib/

        ldid -S deb-pkg/usr/bin/rustc
        ldid -S deb-pkg/usr/bin/cargo

        dpkg-deb -b deb-pkg rust-toolchain-ios.deb

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-ios-deb
        path: rust-toolchain-ios.deb