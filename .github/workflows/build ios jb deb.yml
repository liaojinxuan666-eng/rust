name: Build iOS Rust Toolchain Deb

on:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Rust Source
      uses: actions/checkout@v4

    # 新增：缓存编译产物，避免重复编译
    - name: Cache Cargo and Build Directories
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo
          build
          target
        key: ${{ runner.os }}-rust-ios-cache-v2
        restore-keys: |
          ${{ runner.os }}-rust-ios-

    - name: Install Dependencies
      run: |
        brew install cmake ninja ldid dpkg

    - name: Configure Build
      run: |
        ./configure --host=aarch64-apple-darwin \
                    --target=aarch64-apple-ios \
                    --enable-extended \
                    --tools=cargo,rustc \
                    --disable-docs \
                    --prefix=/tmp/rust-ios

    - name: Build Rust Compiler & Cargo
      run: |
        ./x.py build --stage 2

    # 修改：跳过不稳定的 x.py install，直接手动创建包结构
    - name: Create Deb Package Structure & Sign
      run: |
        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/bin
        mkdir -p deb-pkg/usr/lib/rustlib
        mkdir -p deb-pkg/etc/profile.d
        mkdir -p deb-pkg/usr/share/rust-toolchain-ios

        # 下载 Rust Logo
        curl -L -o deb-pkg/usr/share/rust-toolchain-ios/icon.png https://raw.githubusercontent.com/rust-lang/rust-artwork/master/logo/rust-logo-blk.png

        # 生成 control 文件
        cat > deb-pkg/DEBIAN/control <<EOF
        Package: rust-toolchain-ios
        Name: Rust Toolchain for iOS
        Version: 1.79.0
        Architecture: iphoneos-arm64
        Maintainer: YourName
        Depends: llvm-16, libtapi-dev, libssl3, zlib1g, libzstd1, xz-utils, libcurl4, git, pkg-config, make
        Description: Rust compiler (rustc) and cargo for iOS jailbreak environment.
        Section: Development
        Icon: file:///usr/share/rust-toolchain-ios/icon.png
        EOF

        # 生成环境变量脚本
        cat > deb-pkg/etc/profile.d/rust-ios.sh <<EOF
        export TMPDIR=/tmp
        export TEMP=/tmp
        export TMP=/tmp
        export CC=clang
        export CXX=clang++
        export AR=llvm-ar
        export RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld"
        export PATH=/usr/bin:\$PATH
        EOF

        # 手动复制编译产物 (关键步骤)
        # 1. 复制二进制文件 (cargo 和 rustc)
        cp build/aarch64-apple-darwin/stage2/bin/rustc deb-pkg/usr/bin/
        # cargo 可能在 stage2-tools-bin 目录下
        if [ -f "build/aarch64-apple-darwin/stage2-tools-bin/cargo" ]; then
            cp build/aarch64-apple-darwin/stage2-tools-bin/cargo deb-pkg/usr/bin/
        else
            # 如果找不到，尝试从标准路径查找
            find build/ -name "cargo" -type f -exec cp {} deb-pkg/usr/bin/ \;
        fi

        # 2. 复制标准库 (std) 和其他依赖库
        # 标准库通常位于 stage2/lib/rustlib 下
        if [ -d "build/aarch64-apple-darwin/stage2/lib/rustlib" ]; then
            cp -r build/aarch64-apple-darwin/stage2/lib/rustlib/* deb-pkg/usr/lib/rustlib/
        else
            # 如果路径不对，尝试复制整个 lib 目录
            mkdir -p deb-pkg/usr/lib
            cp -r build/aarch64-apple-darwin/stage2/lib/* deb-pkg/usr/lib/ 2>/dev/null || true
        fi

        # 3. 为所有二进制文件打上越狱伪签名
        find deb-pkg/usr/bin -type f -exec ldid -S {} \;

        # 4. 打包
        dpkg-deb -b deb-pkg rust-toolchain-ios.deb

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-ios-deb
        path: rust-toolchain-ios.deb