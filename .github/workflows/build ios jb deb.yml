name: Build iOS Rust Toolchain Deb

on:
  workflow_dispatch: # 手动触发，方便调试

jobs:
  build-deb:
    runs-on: macos-latest
    timeout-minutes: 360 # 编译 Rust 极耗时间，必须拉长超时限制

    steps:
    - name: Checkout Rust Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install cmake ninja ldid dpkg

    - name: Configure Build
      run: |
        # 关键：加上 --prefix=/tmp/rust-ios，方便后续统一提取文件
        ./configure --host=aarch64-apple-darwin \
                    --target=aarch64-apple-ios \
                    --enable-extended \
                    --tools=cargo,rustc \
                    --disable-docs \
                    --prefix=/tmp/rust-ios

    - name: Build Rust Compiler & Cargo
      run: |
        # 阶段 2 编译，耗时较长
        ./x.py build --stage 2

    - name: Install Toolchain to Prefix
      run: |
        # 将编译好的所有文件 (bin, lib, share) 安装到指定目录
        ./x.py install --prefix=/tmp/rust-ios

    - name: Create Deb Package Structure & Sign
      run: |
        # 1. 创建 deb 包的目录结构
        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/bin
        mkdir -p deb-pkg/etc/profile.d

        # 2. 生成 control 文件（包含你手机上需要的依赖）
        cat > deb-pkg/DEBIAN/control <<EOF
        Package: rust-toolchain-ios
        Name: Rust Toolchain for iOS
        Version: 1.79.0
        Architecture: iphoneos-arm64
        Maintainer: YourName
        Depends: llvm-16, libtapi-dev, libssl3, zlib1g, libzstd1, xz-utils, libcurl4, git, pkg-config, make
        Description: Rust compiler (rustc) and cargo for iOS jailbreak environment.
        Section: Development
        EOF

        # 3. 生成环境变量脚本（安装后会在手机的 /etc/profile.d/ 生效）
        cat > deb-pkg/etc/profile.d/rust-ios.sh <<EOF
        export TMPDIR=/tmp
        export TEMP=/tmp
        export TMP=/tmp
        export CC=clang
        export CXX=clang++
        export AR=llvm-ar
        export RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld"
        export PATH=/usr/bin:\$PATH
        EOF

        # 4. 复制编译产物 (bin 放 usr/bin, lib 放 usr/lib)
        cp -r /tmp/rust-ios/* deb-pkg/usr/

        # 5. 为所有二进制文件打上越狱伪签名
        # 使用 find 自动找到 usr/bin 下的所有可执行文件并签名
        find deb-pkg/usr/bin -type f -exec ldid -S {} \;

        # 6. 打包
        dpkg-deb -b deb-pkg rust-toolchain-ios.deb

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-ios-deb
        path: rust-toolchain-ios.deb