name: Build iOS Rust Toolchain Deb

on:
  workflow_dispatch: # 手动触发

jobs:
  build-deb:
    runs-on: macos-latest
    timeout-minutes: 360 

    steps:
    - name: Checkout Rust Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install cmake ninja ldid dpkg

    - name: Configure Build
      run: |
        ./configure --host=aarch64-apple-darwin \
                    --target=aarch64-apple-ios \
                    --enable-extended \
                    --tools=cargo,rustc \
                    --disable-docs

    - name: Build Rust Compiler & Cargo
      run: |
        ./x.py build --stage 2

    - name: Create Deb Package Structure & Sign
      run: |
        # 1. 创建 deb 包所需的目录结构
        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/bin
        mkdir -p deb-pkg/etc/profile.d

        # 2. 生成 control 文件 (依赖写在这里)
        cat > deb-pkg/DEBIAN/control <<EOF
        Package: rust-toolchain-ios
        Name: Rust Toolchain for iOS
        Version: 1.79.0
        Architecture: iphoneos-arm64
        Maintainer: YourName
        Depends: llvm-16, libtapi-dev, libssl3, zlib1g, libzstd1, xz-utils, libcurl4, git, pkg-config, make
        Description: Rust compiler (rustc) and cargo for iOS jailbreak environment.
        Section: Development
        EOF

        # 3. 生成环境变量配置脚本 (安装后会自动放到手机的 /etc/profile.d/ 下)
        cat > deb-pkg/etc/profile.d/rust-ios.sh <<EOF
        export TMPDIR=/tmp
        export TEMP=/tmp
        export TMP=/tmp
        export CC=clang
        export CXX=clang++
        export AR=llvm-ar
        export RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld"
        export PATH=/usr/bin:\$PATH
        EOF

        # 4. 复制编译产物到 usr/bin
        BIN_DIR="build/aarch64-apple-ios/stage2/bin"
        cp $BIN_DIR/cargo deb-pkg/usr/bin/
        cp $BIN_DIR/rustc deb-pkg/usr/bin/

        # 5. 为二进制文件打上越狱伪签名
        ldid -S deb-pkg/usr/bin/cargo
        ldid -S deb-pkg/usr/bin/rustc

        # 6. 打包成 deb
        dpkg-deb -b deb-pkg rust-toolchain-ios.deb

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-ios-deb
        path: rust-toolchain-ios.deb