name: Build iOS Rust Toolchain Deb

on:
  workflow_dispatch: # 手动触发

jobs:
  build-deb:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Rust Source
      uses: actions/checkout@v4

    # 新增缓存步骤：保存编译产物，避免下次重新编译耗时1小时+
    - name: Cache Cargo and Build Directories
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo
          build
          target
        key: ${{ runner.os }}-rust-ios-${{ hashFiles('**/Cargo.lock', 'config.toml') }}
        restore-keys: |
          ${{ runner.os }}-rust-ios-

    - name: Install Dependencies
      run: |
        brew install cmake ninja ldid dpkg

    - name: Configure Build
      run: |
        # 关键修复：在 configure 阶段加上 --prefix
        ./configure --host=aarch64-apple-darwin \
                    --target=aarch64-apple-ios \
                    --enable-extended \
                    --tools=cargo,rustc \
                    --disable-docs \
                    --prefix=/tmp/rust-ios

    - name: Build Rust Compiler & Cargo
      run: |
        ./x.py build --stage 2

    - name: Install Toolchain to Prefix
      run: |
        # 关键修复：移除 --prefix 参数，直接 install 即可
        ./x.py install

    - name: Create Deb Package Structure & Sign
      run: |
        # 1. 创建 deb 包的目录结构
        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/bin
        mkdir -p deb-pkg/etc/profile.d
        mkdir -p deb-pkg/usr/share/rust-toolchain-ios

        # 2. 下载 Rust Logo 并放入包中
        curl -L -o deb-pkg/usr/share/rust-toolchain-ios/icon.png https://raw.githubusercontent.com/rust-lang/rust-artwork/master/logo/rust-logo-blk.png
        
        # 3. 生成 control 文件 (包含依赖和图标路径)
        cat > deb-pkg/DEBIAN/control <<EOF
        Package: rust-toolchain-ios
        Name: Rust Toolchain for iOS
        Version: 1.79.0
        Architecture: iphoneos-arm64
        Maintainer: YourName
        Depends: llvm-16, libtapi-dev, libssl3, zlib1g, libzstd1, xz-utils, libcurl4, git, pkg-config, make
        Description: Rust compiler (rustc) and cargo for iOS jailbreak environment.
        Section: Development
        Icon: file:///usr/share/rust-toolchain-ios/icon.png
        EOF

        # 4. 生成环境变量脚本
        cat > deb-pkg/etc/profile.d/rust-ios.sh <<EOF
        export TMPDIR=/tmp
        export TEMP=/tmp
        export TMP=/tmp
        export CC=clang
        export CXX=clang++
        export AR=llvm-ar
        export RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld"
        export PATH=/usr/bin:\$PATH
        EOF

        # 5. 复制编译产物 (现在文件肯定在 /tmp/rust-ios 里了)
        cp -r /tmp/rust-ios/* deb-pkg/usr/

        # 6. 为所有二进制文件打上越狱伪签名
        find deb-pkg/usr/bin -type f -exec ldid -S {} \;

        # 7. 打包
        dpkg-deb -b deb-pkg rust-toolchain-ios.deb

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-ios-deb
        path: rust-toolchain-ios.deb